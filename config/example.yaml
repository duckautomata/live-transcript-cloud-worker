# live-transcript-cloud-worker configuration.
# Copy to config/config.yaml (or run `uv run main.py <name>.yaml`).
# Secrets may instead come from env vars:
#   LT_SERVER_API_KEY, DEEPGRAM_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

server:
  # Shared worker credential, sent as X-API-Key on every request.
  apiKey: ""

  # Base URL of live-transcript-server.
  url: https://example.com

  # false = don't talk to the server; write transcripts to
  # tmp/{key}/transcript.text instead. Essential for local development.
  enabled: true

  # Target chunk/line duration in seconds (live-edge: ffmpeg -segment_time;
  # YouTube timeline: each chunk closes at the segment boundary nearest it).
  buffer_size_seconds: 6

  # Concurrent media uploads (shared across channels, round-robin fair).
  media_upload_concurrency: 3

  incoming_polling:
    # true = ignore streamers[].urls; take URLs from GET /{key}/incoming.
    enabled: false
    # Queue poll cadence when events polling is off. With events polling on
    # it is the maximum age of the worker's copy of the queue before a probe:
    # the events signal only announces ADDED URLs, so this bounds how long a
    # URL you removed by hand keeps being probed.
    interval_seconds: 30
    # Consecutive "confirmed offline" probes (yt-dlp's "not currently live",
    # or a resolved was_live/post_live/not_live status, seen while the
    # YouTube cookies authenticate) before a queued URL is removed.
    offline_delete_threshold: 2
    # Consecutive probes that could not tell whether the stream is live (an
    # unrecognised yt-dlp error such as a private/removed video or a bot
    # check, an unknown live_status, a members-only entry the match filter
    # rejected, or any offline verdict while the YouTube cookies are dead,
    # including yt-dlp's own "not currently live" which a signed-out probe
    # cannot be trusted on) before the worker gives up and removes the queued
    # URL. Probe timeouts, yt-dlp network/rate-limit/extractor failures and
    # other worker-side errors never count. At the base cadence this is
    # about N x channel_polling.interval_seconds; while cookies are dead the
    # URL is probed every cookies.degraded_probe_interval_seconds instead, so
    # the same count spans at least N x that, and a re-minted cookies.txt
    # (detected by file change) resumes capture long before it fires. The
    # stream may still be live when this fires; re-queue it once the cause is
    # fixed. 0 = never give up: the URL stays until removed by hand or by the
    # server's queue TTL (streamTtlMinutes, 24 h by default).
    inconclusive_delete_threshold: 10
    # The streak must also have lasted at least this long before the worker
    # gives up, so a short worker-wide hiccup (a datacenter bot check with a
    # healthy jar, an outage the worker did not recognise as its own) cannot
    # drain every channel's queue in ten minutes. 0 = count only.
    inconclusive_min_span_seconds: 3600

  events_polling:
    enabled: true
    # Held-open duration for GET /events; server clamps to [0, 60].
    wait_seconds: 25
    # Safety-net /incoming refresh cadence while events polling works.
    fallback_interval_seconds: 300

  channel_polling:
    # Baseline seconds between liveness probes per URL (yt-dlp -j is
    # expensive; keep this modest or the platform rate-limits you).
    interval_seconds: 60
    # Cap for far-future schedules and confirmed-offline URLs.
    max_interval_seconds: 9000
    # Wake this many seconds before a scheduled start.
    pre_scheduled_buffer_seconds: 300

  cookies:
    # Pass --cookies to yt-dlp (Netscape-format files at the project root).
    # Needed when running from datacenter IPs; leave disabled on a
    # residential connection. Twitch never gets cookies (it doesn't need
    # them); these apply to YouTube and other platforms.
    enabled: false
    # Separate files so the polling cookie and the download cookie can be
    # rotated/scoped independently. May point at the same file.
    check_filename: cookies.txt
    download_filename: cookies.txt
    # While yt-dlp reports the jar is not authenticating, YouTube URLs are
    # probed at this slower cadence instead of channel_polling.interval_seconds:
    # every probe with a dead jar is a wasted run that also rewrites
    # cookies.txt. Overwriting cookies.txt in place (cp / cat > / scp onto the
    # existing path) re-probes them immediately; a rename-style replacement
    # (mv, rsync without --inplace, an editor's atomic save) is invisible
    # through a single-file Docker bind mount and needs a container restart.
    # yt-dlp writes its in-memory jar back on exit, so a capture that is
    # running when you overwrite the file puts the OLD cookies back when it
    # ends: give check_filename and download_filename different files, or
    # copy the jar again once the capture is over.
    degraded_probe_interval_seconds: 600

  stale_threshold:
    # YouTube timeline: catch up on missed segments from at most this far
    # behind live (after a hiccup or a restart); further behind, jump to the
    # live edge. Time spent waiting on a backed-up pipeline (transcription or
    # the server falling behind) widens it, so a backlog of our own doesn't
    # skip segments YouTube still serves. It also waits at most half of this
    # between failed yt-dlp runs, so a stream coming back from an outage is
    # never skipped.
    lfs_gap_seconds: 600
    # Live-edge only: no new segment for this long => terminate a wedged yt-dlp.
    ytdlp_seconds: 180
    # Segments keep arriving but none carry usable audio for this long =>
    # the connection is assumed broken. Live-edge restarts capture with a
    # fresh yt-dlp connection; the YouTube timeline re-resolves the stream
    # and reconnects.
    no_audio_seconds: 60

capture:
  # Paths to external binaries (absolute, or resolved on PATH).
  yt_dlp_path: yt-dlp
  ffmpeg_path: ffmpeg
  # Live-edge timestamp anchor: segment_mtime - duration - this. The YouTube
  # timeline uses it too, for a chunk whose clock can't be trusted (stamped
  # by arrival: now - duration - this, not VOD-accurate).
  live_latency_seconds: 1
  # Live-edge only: added to live_latency_seconds for YouTube streamers with
  # media_type video. YouTube's video track reaches the worker ~1s after its
  # audio, and with the two kept in sync the video decides when each
  # segment closes. Measured on a 1s-segment stream; may need tuning.
  youtube_video_extra_latency_seconds: 1
  # Process-wide cap on concurrent yt-dlp -j probes.
  probe_concurrency: 4
  probe_timeout_seconds: 30

transcription:
  # Which registered provider to use. Built-in: deepgram | cloudflare.
  # New providers are one module in live_transcript_cloud_worker/providers/
  # (see providers/base.py); their options go in a section named after them,
  # exactly like the deepgram/cloudflare blocks below.
  provider: deepgram
  # Optional second provider tried when the primary exhausts its retries.
  # Leave empty to disable. Requires that provider's credentials too.
  fallback_provider: ""
  language: en
  # Per-channel in-flight transcription requests. Results are re-ordered
  # before line submission, so this only affects throughput, not ordering.
  concurrency: 2
  request_timeout_seconds: 30
  max_retries: 4
  # Chunks measured shorter than this emit no line (typically ad breaks).
  min_chunk_seconds: 0.5

  deepgram:
    # nova-3 pre-recorded (~$0.0043/audio-minute pay-as-you-go).
    api_key: ""
    model: nova-3
    smart_format: true
    filler_words: false
    # Up to ~50 domain terms to boost (names, jargon). Nova-3 keyterm.
    keyterms: []

  cloudflare:
    # Workers AI whisper ($0.0005/audio-minute for large-v3-turbo).
    # Token needs the "Workers AI" permission template.
    account_id: ""
    api_token: ""
    model: "@cf/openai/whisper-large-v3-turbo"
    # Voice-activity-detection preprocessing; mitigates whisper's
    # hallucination-on-silence failure mode.
    vad_filter: true

streamers:
  - key: example # must match a channel key in the server config
    urls: # ignored when incoming_polling.enabled
      - https://www.youtube.com/@example/live
      - https://www.twitch.tv/example
    active: true
    media_type: none # none | audio | video
    # YouTube only. If true, this streamer's YouTube streams are captured with
    # the YouTube timeline: it joins at the live edge but stamps every line
    # with YouTube's own clock, so every line is VOD-accurate (even with DVR
    # disabled). It is used exclusively: there is no fallback to live-edge
    # capture. Works with cookies enabled. Twitch URLs are unaffected.
    # Must be an unquoted true/false.
    use_youtube_timeline: false

# Stream IDs never to transcribe (e.g. a 24/7 loop).
id_blacklist: []
